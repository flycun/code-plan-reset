name: glm-anchor

on:
  schedule:
    # BACKUP trigger: early at UTC 16:17 (Beijing 00:17), off the top-of-hour
    # congestion peak. PRIMARY trigger is the Cloudflare Worker in
    # anchor-dispatch/ calling workflow_dispatch at UTC 21:30. Whichever run
    # arrives later wins (cancel-in-progress) and sleeps until Beijing 06:00.
    # ~5h43m buffer absorbs multi-hour cron delays while staying under the
    # 6h-per-job hard cap. Public repo = free minutes, waiting is cost-free.
    - cron: "17 16 * * *"
  workflow_dispatch:

# Newest run wins: a later trigger cancels a predecessor still sitting in its
# wait-until-anchor sleep, so exactly one run performs the 06:00 anchor.
concurrency:
  group: code-plan-anchor
  cancel-in-progress: true

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v7

      - name: wait-until-anchor
        run: |
          # Hold until Beijing 06:00 (UTC 22:00) regardless of when the run
          # actually started. Earliest trigger is the 16:17 UTC backup cron,
          # so a legitimate wait is always < 5h45m. If the run started so
          # late that the UTC date rolled over, "today 22:00" points to the
          # wrong day (diff ~21h) — run immediately instead of sleeping to
          # timeout. 6h sanity cap.
          now=$(date -u +%s)
          target=$(date -u -d 'today 22:00:00' +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 21600 ]; then
            echo "Waiting ~$(( diff/60 )) min until Beijing 06:00..."
            sleep "$diff"
          else
            echo "Past anchor or abnormal gap (diff=${diff}s), run now."
          fi
          echo "BJ_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install-claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: compose-mail
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "$(cat .github/prompts/trending.txt)" \
            --dangerously-skip-permissions \
            --output-format text > email-body.html
          echo "bytes:"; wc -c < email-body.html

      - name: send-mail
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "GitHub Trending <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: GitHub Trending Daily Top 10 - ${{ env.BJ_DATE }}
          html_body: file://email-body.html

  # Anchor the MiniMax Coding Plan 5h window at the SAME moment (Beijing 06:00):
  # identical triggers + identical wait-until-anchor step, then one minimal
  # `claude -p` call via MiniMax's Anthropic-compatible endpoint.
  anchor-minimax:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: anchor-minimax
      cancel-in-progress: true
    steps:
      - name: wait-until-anchor
        run: |
          # Same anchor as the GLM job: hold until Beijing 06:00 (UTC 22:00).
          # 6h sanity cap — see the anchor job's wait step for details.
          now=$(date -u +%s)
          target=$(date -u -d 'today 22:00:00' +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 21600 ]; then
            echo "Waiting ~$(( diff/60 )) min until Beijing 06:00..."
            sleep "$diff"
          else
            echo "Past anchor or abnormal gap (diff=${diff}s), run now."
          fi
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install-claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: anchor-ping
        env:
          # M Plan (platform.minimax.cn subscription): https://api.minimax.cn/anthropic
          # International (platform.minimax.io):        https://api.minimax.io/anthropic
          # Keys are NOT interchangeable between the two platforms.
          ANTHROPIC_BASE_URL: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimax.cn/anthropic' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "Reply with exactly: ok" \
            --dangerously-skip-permissions \
            --output-format text
          echo "MiniMax anchor call done at $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
