name: glm-anchor

on:
  schedule:
    # BACKUP trigger: UTC 21:21 (Beijing 05:21), 39 min before the UTC 22:00
    # anchor and 9 min before the PRIMARY Cloudflare Worker dispatch (21:30).
    # Both runs sleep until Beijing 06:00; the later Worker run cancels the
    # still-sleeping cron run (cancel-in-progress), so normally only the
    # Worker run anchors. If the Worker is dead but GitHub schedules this
    # cron on time, IT sleeps to 22:00 and anchors precisely — a real backup.
    # Historically GitHub cron lags 2-7h; a lagging run fires AFTER the
    # anchor and is deduped by the cache marker (see check-anchor-marker).
    - cron: "21 21 * * *"
  workflow_dispatch:

# Newest run wins: a later trigger cancels a predecessor still sitting in its
# wait-until-anchor sleep, so exactly one run performs the 06:00 anchor.
concurrency:
  group: code-plan-anchor
  cancel-in-progress: true

jobs:
  anchor:
    name: anchor (GLM)
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v7

      - name: wait-until-anchor
        id: wait
        run: |
          # Hold until Beijing 06:00 (UTC 22:00) regardless of when the run
          # actually started. Earliest possible trigger is the 21:21 UTC backup
          # cron, so a legitimate wait is always < 39 min. Any run starting
          # after 22:00 runs immediately (past anchor). If the run started so
          # late that the UTC date rolled over, "today 22:00" points to the
          # wrong day (diff ~21h) — run immediately instead of sleeping to
          # timeout. 6h sanity cap.
          now=$(date -u +%s)
          target=$(date -u -d 'today 22:00:00' +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 21600 ]; then
            echo "Waiting ~$(( diff/60 )) min until Beijing 06:00..."
            sleep "$diff"
            anchor_instant=$target
          elif [ "$diff" -le 0 ]; then
            echo "Past anchor by $(( -diff ))s, running now."
            anchor_instant=$target
          else
            # "today 22:00" is >6h away => we are in the post-midnight tail
            # (UTC 00:00-16:00); the anchor we missed is YESTERDAY's 22:00.
            echo "Abnormal gap (diff=${diff}s): missed anchor is yesterday 22:00 UTC, running now."
            anchor_instant=$(date -u -d 'yesterday 22:00:00' +%s)
          fi
          # Beijing date of the anchor instant == the key used by the marker
          # cache, so a late run can prove whether that anchor already happened.
          echo "anchor_date=$(TZ=Asia/Shanghai date -d "@$anchor_instant" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "BJ_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      # Evidence check: did this provider's anchor for anchor_date already
      # happen? The marker is written by the run that actually consumed quota.
      # lookup-only never fails when the key is absent (cache-hit=false), and
      # a hard failure leaves cache-hit empty -> fail-open (we anchor anyway).
      - name: prepare-marker-dir
        run: mkdir -p .anchor-marker

      - name: check-anchor-marker
        id: marker
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .anchor-marker
          key: anchor-glm-${{ steps.wait.outputs.anchor_date }}
          lookup-only: true

      # Restore the toolchain steps dropped in 90f8778 (caused the Nov 22
      # failures: claude: command not found, exit 127). Guarded by the same
      # condition so a marker-hit skip day doesn't even pay for npm install.
      - uses: actions/setup-node@v5
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - name: install-claude-code
        if: steps.marker.outputs.cache-hit != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: compose-mail
        if: steps.marker.outputs.cache-hit != 'true'
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "$(cat .github/prompts/trending.txt)" \
            --dangerously-skip-permissions \
            --output-format text > email-body.html
          echo "bytes:"; wc -c < email-body.html

      # Record the anchor BEFORE sending mail: quota is consumed by the
      # claude call above, so the marker must exist even if SMTP fails.
      - name: write-anchor-marker
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p .anchor-marker
          {
            echo "anchored_at=$(date -u +%FT%TZ)"
            echo "anchor_date=${{ steps.wait.outputs.anchor_date }}"
          } > .anchor-marker/marker

      - name: mark-anchored
        if: steps.marker.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .anchor-marker
          key: anchor-glm-${{ steps.wait.outputs.anchor_date }}

      - name: send-mail
        if: steps.marker.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "GitHub Trending <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: GitHub Trending Daily Top 10 - ${{ env.BJ_DATE }}
          html_body: file://email-body.html

  # Anchor the MiniMax Coding Plan 5h window at the SAME moment (Beijing 06:00):
  # identical triggers + identical wait-until-anchor step, then one minimal
  # `claude -p` call via MiniMax's Anthropic-compatible endpoint.
  anchor-minimax:
    name: anchor (MiniMax)
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: anchor-minimax
      cancel-in-progress: true
    steps:
      - name: wait-until-anchor
        id: wait
        run: |
          # Same anchor as the GLM job: hold until Beijing 06:00 (UTC 22:00).
          # Legitimate wait < 39 min (earliest trigger: 21:21 backup cron).
          # 6h sanity cap — see the anchor job's wait step for details.
          now=$(date -u +%s)
          target=$(date -u -d 'today 22:00:00' +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 21600 ]; then
            echo "Waiting ~$(( diff/60 )) min until Beijing 06:00..."
            sleep "$diff"
            anchor_instant=$target
          elif [ "$diff" -le 0 ]; then
            echo "Past anchor by $(( -diff ))s, running now."
            anchor_instant=$target
          else
            echo "Abnormal gap (diff=${diff}s): missed anchor is yesterday 22:00 UTC, running now."
            anchor_instant=$(date -u -d 'yesterday 22:00:00' +%s)
          fi
          echo "anchor_date=$(TZ=Asia/Shanghai date -d "@$anchor_instant" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - name: prepare-marker-dir
        run: mkdir -p .anchor-marker

      - name: check-anchor-marker
        id: marker
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .anchor-marker
          key: anchor-minimax-${{ steps.wait.outputs.anchor_date }}
          lookup-only: true

      # Restore the toolchain steps dropped in 90f8778 (see anchor job note).
      - uses: actions/setup-node@v5
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - name: install-claude-code
        if: steps.marker.outputs.cache-hit != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: anchor-ping
        if: steps.marker.outputs.cache-hit != 'true'
        env:
          # M Plan (platform.minimax.cn subscription): https://api.minimax.cn/anthropic
          # International (platform.minimax.io):        https://api.minimax.io/anthropic
          # Keys are NOT interchangeable between the two platforms.
          ANTHROPIC_BASE_URL: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimax.cn/anthropic' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "Reply with exactly: ok" \
            --dangerously-skip-permissions \
            --output-format text
          echo "MiniMax anchor call done at $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - name: write-anchor-marker
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p .anchor-marker
          {
            echo "anchored_at=$(date -u +%FT%TZ)"
            echo "anchor_date=${{ steps.wait.outputs.anchor_date }}"
          } > .anchor-marker/marker

      - name: mark-anchored
        if: steps.marker.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .anchor-marker
          key: anchor-minimax-${{ steps.wait.outputs.anchor_date }}
