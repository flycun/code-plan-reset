name: glm-anchor

on:
  schedule:
    # Fire EARLY at UTC 20:00 (Beijing 04:00), then the wait step below holds
    # until Beijing 06:00 sharp. Anchor fixed at 06:00 -> reset at 11:00.
    # 2h buffer: cron latency can reach ~2h; public repo = free minutes, so
    # waiting is cost-free.
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: glm-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: wait-until-anchor
        run: |
          # Hold until Beijing 06:00 (UTC 22:00) regardless of when cron actually fired.
          # Cron is 20:00 UTC, so a legitimate wait is always < 2h. If cron fired so
          # late that the UTC date rolled over, "today 22:00" points to the wrong
          # day (diff ~21h) — run immediately instead of sleeping until timeout.
          now=$(date -u +%s)
          target=$(date -u -d 'today 22:00:00' +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 7200 ]; then
            echo "Waiting ~$(( diff/60 )) min until Beijing 06:00..."
            sleep "$diff"
          else
            echo "Past anchor or abnormal gap (diff=${diff}s), run now."
          fi
          echo "BJ_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install-claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: compose-mail
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "$(cat .github/prompts/trending.txt)" \
            --dangerously-skip-permissions \
            --output-format text > email-body.html
          echo "bytes:"; wc -c < email-body.html

      - name: send-mail
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "GitHub Trending <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: GitHub Trending Daily Top 10 - ${{ env.BJ_DATE }}
          html_body: file://email-body.html
