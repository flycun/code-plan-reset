name: glm-anchor

on:
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch:

concurrency:
  group: glm-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: print-time
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "BJ : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install-claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      - name: anchor-call
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "${{ vars.ANCHOR_PROMPT || 'ping' }}" --model "$ANTHROPIC_MODEL"
