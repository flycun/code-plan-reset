name: glm-anchor

on:
  # Sole trigger: the Cloudflare Worker in anchor-dispatch/ fires a
  # workflow_dispatch with a `slot` input 30 min before each anchor instant.
  # GitHub schedule crons were removed: in practice they fired 4-8h late
  # every day (observed 2026-11), arrived after the anchor, and were deduped
  # in seconds — pure noise. Manual UI runs still work (slot defaults to "a").
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to anchor: glm or minimax"
        required: false
        default: "glm"
      slot:
        description: "Anchor slot: a = morning, b = midday"
        required: false
        default: "a"

# Newest run wins: a later trigger cancels a predecessor still sitting in its
# wait-until-anchor sleep, so exactly one run performs each anchor.
concurrency:
  group: code-plan-anchor
  cancel-in-progress: true

jobs:
  anchor:
    name: anchor (${{ inputs.provider }} / ${{ inputs.slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      # Which provider+slot this run serves — the dispatch inputs sent by the
      # Cloudflare Worker (manual UI runs default to glm/a), never guessed
      # from the clock.
      DISPATCH_PROVIDER: ${{ inputs.provider }}
      DISPATCH_SLOT: ${{ inputs.slot }}
    steps:
      - uses: actions/checkout@v7

      - name: wait-until-anchor
        id: wait
        run: |
          # Hold until the anchor instant of THIS provider+slot, regardless of
          # when the run actually started.
          #
          #   glm     slot a -> UTC 22:00 = Beijing 06:00  (window 06:00-11:00)
          #   minimax slot a -> UTC 22:30 = Beijing 06:30  (window 06:30-11:30)
          #   glm     slot b -> UTC 03:10 = Beijing 11:10  (window 11:10-16:10)
          #   minimax slot b -> UTC 03:40 = Beijing 11:40  (window 11:40-16:40)
          #
          # The 30-min stagger keeps the two 5h windows from expiring at the
          # same time, and covers GLM's 14:00-18:00 peak window (2x credits)
          # with MiniMax. provider+slot come from the dispatch inputs, so every
          # trigger of the same target resolves to the same anchor instant and
          # therefore to the same marker key.
          provider="${DISPATCH_PROVIDER:-glm}"
          slot="${DISPATCH_SLOT:-a}"
          case "$provider/$slot" in
            glm/a)     anchor_time="22:00:00" ;;
            minimax/a) anchor_time="22:30:00" ;;
            glm/b)     anchor_time="03:10:00" ;;
            minimax/b) anchor_time="03:40:00" ;;
            *) echo "Unknown target '$provider/$slot'"; exit 1 ;;
          esac
          echo "Serving $provider slot $slot (anchor UTC $anchor_time)"
          now=$(date -u +%s)
          today=$(date -u +%Y-%m-%d)
          target=$(date -u -d "$today $anchor_time" +%s)
          diff=$((target - now))
          if [ "$diff" -gt 0 ] && [ "$diff" -le 21600 ]; then
            echo "Waiting ~$(( diff/60 )) min until UTC $today $anchor_time..."
            sleep "$diff"
            anchor_instant=$target
          elif [ "$diff" -le 0 ]; then
            # Anchor point already passed (late trigger) -> run now, anchored
            # at today's slot instant so the marker key still matches.
            echo "Past anchor by $(( -diff ))s, running now."
            anchor_instant=$target
          else
            # "today <slot>" is more than 6h away -> we are in the tail of the
            # previous cycle; anchor at THAT cycle's slot instant (already
            # past) and run now. Keeps the marker key aligned with the cycle.
            echo "Abnormal gap (diff=${diff}s): using previous cycle's anchor instant."
            anchor_instant=$(date -u -d "@$(( target - 86400 ))" +%s)
          fi
          # Beijing date of the anchor instant == the key used by the marker
          # cache, so any trigger of the same slot can prove it already ran.
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "anchor_date=$(TZ=Asia/Shanghai date -d "@$anchor_instant" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "BJ_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Anchor time (Beijing): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      # Evidence check: did this provider's anchor for (slot, anchor_date)
      # already happen? The marker is written by the run that consumed quota.
      # lookup-only never fails when the key is absent (cache-hit=false), and
      # a hard failure leaves cache-hit empty -> fail-open (we anchor anyway).
      - name: prepare-marker-dir
        run: mkdir -p .anchor-marker

      - name: check-anchor-marker
        id: marker
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .anchor-marker
          key: anchor-${{ inputs.provider }}-${{ steps.wait.outputs.slot }}-${{ steps.wait.outputs.anchor_date }}
          lookup-only: true

      - uses: actions/setup-node@v5
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - name: install-claude-code
        if: steps.marker.outputs.cache-hit != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: skip-onboarding
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{"hasCompletedOnboarding":true}' > ~/.claude.json

      # Slot a: GLM runs the full Trending job (model call + email).
      # Slot b: GLM only makes a minimal model call — the quota window must
      # be consumed to open window B, but no second email is needed.
      - name: compose-mail
        if: inputs.provider == 'glm' && steps.wait.outputs.slot == 'a' && steps.marker.outputs.cache-hit != 'true'
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "$(cat .github/prompts/trending.txt)" \
            --dangerously-skip-permissions \
            --output-format text > email-body.html
          echo "bytes:"; wc -c < email-body.html

      - name: anchor-ping-glm
        if: inputs.provider == 'glm' && steps.wait.outputs.slot == 'b' && steps.marker.outputs.cache-hit != 'true'
        env:
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.GLM_MODEL || 'glm-4.6' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "Reply with exactly: ok" \
            --dangerously-skip-permissions \
            --output-format text
          echo "GLM slot b anchor call done at $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      - name: anchor-ping-minimax
        if: inputs.provider == 'minimax' && steps.marker.outputs.cache-hit != 'true'
        env:
          # M Plan (platform.minimax.cn subscription): https://api.minimax.cn/anthropic
          # International (platform.minimax.io):        https://api.minimax.io/anthropic
          # Keys are NOT interchangeable between the two platforms.
          ANTHROPIC_BASE_URL: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimax.cn/anthropic' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M3.1-Flash' }}
          DISABLE_TELEMETRY: "1"
        run: |
          claude -p "Reply with exactly: ok" \
            --dangerously-skip-permissions \
            --output-format text
          echo "MiniMax anchor call done at $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      # Record the anchor BEFORE sending mail: quota is consumed by the
      # claude call above, so the marker must exist even if SMTP fails.
      - name: write-anchor-marker
        if: steps.marker.outputs.cache-hit != 'true'
        run: |
          mkdir -p .anchor-marker
          {
            echo "anchored_at=$(date -u +%FT%TZ)"
            echo "provider=${{ inputs.provider }}"
            echo "slot=${{ steps.wait.outputs.slot }}"
            echo "anchor_date=${{ steps.wait.outputs.anchor_date }}"
          } > .anchor-marker/marker

      - name: mark-anchored
        if: steps.marker.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .anchor-marker
          key: anchor-${{ inputs.provider }}-${{ steps.wait.outputs.slot }}-${{ steps.wait.outputs.anchor_date }}

      - name: send-mail
        if: inputs.provider == 'glm' && steps.wait.outputs.slot == 'a' && steps.marker.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "GitHub Trending <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.MAIL_TO }}
          subject: GitHub Trending Daily Top 10 - ${{ env.BJ_DATE }}
          html_body: file://email-body.html
